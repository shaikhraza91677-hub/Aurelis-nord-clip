services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurelis
      POSTGRES_USER: aurelis
      POSTGRES_PASSWORD: aurelis_dev_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelis -d aurelis"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      APP_URL: http://web:3000
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-1}
    volumes:
      - uploads:/app/uploads
      - output:/app/output

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      WORKER_URL: http://worker:8080
      WORKER_OUTPUT_DIR: /app/output
      DATABASE_URL: postgresql://aurelis:aurelis_dev_change_me@db:5432/aurelis?schema=public
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
      - output:/app/output

volumes:
  postgres_data:
  uploads:
  output:
